name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Moodle plugin ZIP
        run: |
          git archive --format=zip --prefix=user/ "${GITHUB_REF_NAME}" -o "local_user-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: local_user-${{ github.ref_name }}.zip
          generate_release_notes: true

